<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Заглушка: заменить на фото колеса без фона (assets/wheel.png) -->
  <defs>
    <radialGradient id="tire" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#1d1e20"/>
      <stop offset="86%" stop-color="#111214"/>
      <stop offset="100%" stop-color="#060607"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9ea3"/>
      <stop offset=".5" stop-color="#43464a"/>
      <stop offset="1" stop-color="#1c1e20"/>
    </linearGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#666a70"/>
      <stop offset="1" stop-color="#1f2123"/>
    </radialGradient>
  </defs>

  <circle cx="300" cy="300" r="296" fill="url(#tire)"/>
  <circle cx="300" cy="300" r="282" fill="none" stroke="#2b2d30" stroke-width="20" stroke-dasharray="12 9"/>
  <circle cx="300" cy="300" r="252" fill="none" stroke="#26282b" stroke-width="2"/>

  <circle cx="300" cy="300" r="198" fill="url(#rim)"/>
  <circle cx="300" cy="300" r="184" fill="#121315"/>

  <g fill="url(#rim)">
    <path id="spoke" d="M280 120 L320 120 L313 250 L287 250 Z"/>
    <use href="#spoke" transform="rotate(72 300 300)"/>
    <use href="#spoke" transform="rotate(144 300 300)"/>
    <use href="#spoke" transform="rotate(216 300 300)"/>
    <use href="#spoke" transform="rotate(288 300 300)"/>
  </g>

  <circle cx="300" cy="300" r="58" fill="url(#hub)"/>
  <g fill="#101113">
    <circle id="bolt" cx="300" cy="266" r="6"/>
    <use href="#bolt" transform="rotate(72 300 300)"/>
    <use href="#bolt" transform="rotate(144 300 300)"/>
    <use href="#bolt" transform="rotate(216 300 300)"/>
    <use href="#bolt" transform="rotate(288 300 300)"/>
  </g>
  <circle cx="300" cy="300" r="15" fill="#C2B096"/>
</svg>
